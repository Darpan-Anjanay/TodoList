<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        To Do App
        {% block title %}
        {% endblock title %}
    </title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white hover-lift" href="{% url 'Home' %}">To Do App</a>
            <a class="navbar-brand fw-bold text-white hover-lift" href="{% url 'Home' %}">Home</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                {% if request.user.is_authenticated %}
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <span class="navbar-text fw-bold text-white me-3">Welcome, {{ request.user.username }}</span>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-light btn-sm" href="{% url 'Logout' %}">Logout</a>
                    </li>
                </ul>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-start">
            <button onclick="history.back()" class="btn btn-secondary btn-sm mb-3">← Go Back</button>
        </div>

        {% block content %}
        {% endblock content %}
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
