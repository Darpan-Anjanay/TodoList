{% extends "Todo/Base.html" %}
 {% block title %} | Add / Update Task
        {% endblock title %}

{% block content %}
<div class="container mt-4">
    <form action="" method="post" class="p-3">
        {% csrf_token %}
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Add / Update Task</h5>
            </div>

            <div class="card-body bg-light">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="Title" class="form-label fw-semibold">Title</label>
                        <input type="text" name="Title" class="form-control" id="Title" value="{{ Todoobj.Title }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="CompletionDate" class="form-label fw-semibold">Completion Date</label>
                        <input type="date" name="CompletionDate" class="form-control" id="CompletionDate"
                               value="{% if Todoobj.CompletionDate %}{{ Todoobj.CompletionDate|date:'Y-m-d' }}{% else %}{% now 'Y-m-d' %}{% endif %}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Completion Status</label>
                        <div class="form-check">
                            <input type="checkbox" name="completionStatus" class="form-check-input" id="completionStatus" {% if Todoobj.completionStatus %}checked{% endif %}>
                            <label class="form-check-label" for="completionStatus">Completed</label>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <label for="Description" class="form-label fw-semibold">Description</label>
                        <textarea name="Description" id="Description" class="form-control" rows="5" required>{{ Todoobj.Description }}</textarea>
                    </div>
                </div>
            </div>

            <div class="card-footer bg-white text-end">
                <button type="submit" name="Submit" class="btn btn-primary btn-sm">Submit Task</button>
            </div>
        </div>
    </form>
</div>
{% endblock content %}
